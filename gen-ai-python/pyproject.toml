[project]
name = "gen-ai-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prajjwal.Walchale", email = "prajjwal.walchale.ext@omnenest.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gen-ai-python = "gen_ai_python:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"